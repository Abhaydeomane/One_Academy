packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  next: 16.4.0
  express: 5.3.0
  '@types/express': 5.0.6
  # Declared explicitly because src/middleware augments its Request interface;
  # pnpm's strict node_modules will not resolve it as a transitive dependency.
  '@types/express-serve-static-core': 5.1.3
  zod: 4.6.5
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  '@prisma/client-runtime-utils': 7.10.0
  pg: 8.23.1
  '@types/pg': 8.23.1
  typescript: 6.0.3
  '@types/node': 22.20.5
  vitest: 5.0.3
  supertest: 7.3.1
  '@types/supertest': 7.2.1
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  pino: 10.4.0
  pino-pretty: 13.2.0
  '@clerk/nextjs': 7.9.14
  '@clerk/express': 2.1.78
  tsx: 4.23.15
  '@asteasolutions/zod-to-openapi': 9.1.0
  express-rate-limit: 8.7.1
  '@playwright/test': 1.64.0

# pnpm 12 blocks post-install scripts by default and records approvals here as
# `allowBuilds` (not `onlyBuiltDependencies`, which earlier versions used).
# Managed by `pnpm approve-builds <pkg> -y`.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
